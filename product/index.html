<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Document</title>
    <link href="/src/style/tailwind.css" rel="stylesheet" />
  </head>

  <body class="flex flex-col min-h-svh items-center">
    <header class="w-full">
      <div class="ml-4 h-16 flex items-center gap-4">
        <div class="h-8 w-8 rounded-full bg-blue-400">
          <!--TODO: Replace with img tag-->
        </div>
        <div>
          <div>Hello, <span class="text-blue-400">user</span>!</div>
          <div class="text-xs text-gray-500">ID: <span>id</span></div>
        </div>
      </div>
    </header>

    <main class="flex grow container mx-auto mt-4 gap-4">
      <div class="w-108 flex flex-col gap-2">
        <div class="bg-yellow-300 w-108 min-h-108 rounded-lg"></div>
        <div class="flex">
          <div class="grow">
            <p class="text-2xl">Pocky Strawberry 75gr</p>
            <div class="flex gap-2">
              <p class="text-2xl text-red-500">Rp. 9,000</p>
              <div class="text-xs">
                <p class="text-gray-400 line-through">Rp. 10,000</p>
                <span class="bg-red-500 text-white">-10 %</span>
              </div>
            </div>
            <p class="text-sm text-gray-400">PT. Glico Indonesia</p>
          </div>
          <div>ID Produk: MM3317</div>
        </div>
      </div>

      <div class="grow flex-col flex">
        <div class="min-h-108 flex flex-col gap-4">
          <nav class="flex py-4 gap-4 items-center w-full justify-end">
            <div class="relative">
              <div
                class="w-8 h-8 rounded-full bg-yellow-400 flex justify-center items-center"
              >
                <img
                  src="/src/assets/icons/andrsrxn--shopping-cart.svg"
                  class="w-6 h-6"
                />
              </div>
              <div
                class="bg-red-500 min-w-4 h-4 top-0 right-0 absolute rounded-full translate-x-1/3 -translate-y-1/3 text-white text-10px leading-none flex items-center justify-center px-1 ring-2 ring-white empty:hidden"
                id="cart-badge"
              >
                3
              </div>
            </div>
            <form id="search" class="w-2/3 h-8 flex items-center">
              <input
                type="text"
                class="w-full h-full pl-4 rounded-l-full bg-blue-400"
                placeholder="Search Something..."
              />
              <button
                type="submit"
                class="bg-blue-400 h-full rounded-r-full flex items-center justify-center pr-4 cursor-pointer"
              >
                <img
                  src="/src/assets/icons/akar-icons--search.svg"
                  class="h-6"
                />
              </button>
            </form>
          </nav>

          <p class="text-2xl font-bold">About Product :</p>
          <p class="text-xl text-gray-400">lorem ipsum dolor sit amet</p>
        </div>

        <div class="justify-end">
          <form class="flex flex-col w-full md:w-96 items-center">
            <div>
              <button>-</button>
              <input type="number" placeholder="1" class="text-center [appearance:textfield]" />
              <button>+</button>
            </div>
            <button class="bg-blue-400 p-4 rounded-full w-full">
              Add to Cart
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer class="flex">
      <div>Unlicensed, this software is illegal</div>
    </footer>

    <script src="/src/modules/product-page.js" type="module"></script>
  </body>
</html>
